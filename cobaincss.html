<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prince lOGIN cLNUT/title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            padding: 25px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            color: #fff8e8;
            background: #17152d;
            overflow-x: hidden;
            position: relative;
        }

        /* BACKGROUND JONG WOO */
        body::before {
            content: "";
            position: fixed;
            inset: -20px;
            z-index: -3;

            background-image:
                linear-gradient(
                    rgba(19, 17, 43, 0.30),
                    rgba(19, 17, 43, 0.48)
                ),
                url("jongwoo.jfif");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            animation: backgroundMove 18s ease-in-out infinite alternate;
        }

        @keyframes backgroundMove {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.10) translateY(-8px);
            }
        }

        /* LAPISAN CAHAYA */
        .glow {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(201, 177, 255, 0.18),
                    transparent 40%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(137, 160, 255, 0.15),
                    transparent 40%
                );
        }

        /* BINTANG BERKELIP */
        .stars {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        .stars span {
            position: absolute;
            color: #f5dfa2;
            font-size: 22px;
            animation: twinkle 3s ease-in-out infinite,
                       floatStar 6s ease-in-out infinite;
        }

        .stars span:nth-child(1) {
            top: 10%;
            left: 12%;
        }

        .stars span:nth-child(2) {
            top: 20%;
            right: 15%;
            animation-delay: 1s;
        }

        .stars span:nth-child(3) {
            top: 75%;
            left: 10%;
            animation-delay: 2s;
        }

        .stars span:nth-child(4) {
            top: 12%;
            right: 35%;
            font-size: 30px;
        }

        .stars span:nth-child(5) {
            top: 60%;
            right: 10%;
            animation-delay: 1.5s;
        }

        .stars span:nth-child(6) {
            top: 85%;
            right: 25%;
            animation-delay: 0.5s;
        }

        .stars span:nth-child(7) {
            top: 40%;
            left: 5%;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes floatStar {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        /* KOTAK UTAMA */
        .container {
            width: 100%;
            max-width: 650px;
            padding: 38px 25px;
            text-align: center;

            background: rgba(25, 22, 51, 0.68);
            border: 1px solid rgba(240, 220, 174, 0.45);
            border-radius: 25px;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.3),
                0 0 25px rgba(190, 165, 255, 0.12);

            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);

            animation: appear 1s ease both;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* BULAN */
        .moon {
            font-size: 52px;
            color: #f4dfa5;
            text-shadow: 0 0 20px rgba(244, 223, 165, 0.6);
            animation: moonMove 4s ease-in-out infinite;
        }

        @keyframes moonMove {
            0%, 100% {
                transform: translateY(0) rotate(-5deg);
            }

            50% {
                transform: translateY(-8px) rotate(5deg);
            }
        }

        /* SUBJUDUL */
        .subtitle {
            margin-top: 12px;
            color: #e0d1fa;
            font-size: 11px;
            letter-spacing: 4px;
        }

        /* JUDUL */
        .judul {
            margin: 20px 0 15px;
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(34px, 6vw, 52px);
            font-weight: 600;
            line-height: 1.15;
            color: #fff5db;
            text-shadow: 0 0 15px rgba(239, 218, 171, 0.2);
        }

        .judul span {
            display: block;
            color: #e7cf98;
            font-style: italic;
        }

        /* TULISAN CUTIE */
        .n {
            display: inline-block;
            margin: 10px 0 25px;
            padding: 10px 18px;

            color: #f4d8ee;
            font-size: 14px;

            background: rgba(177, 140, 205, 0.18);
            border: 1px solid rgba(220, 185, 230, 0.4);
            border-radius: 30px;

            animation: gentlePulse 3s infinite;
        }

        @keyframes gentlePulse {
            0%, 100% {
                box-shadow: 0 0 0 rgba(216, 173, 238, 0);
            }

            50% {
                box-shadow: 0 0 16px rgba(216, 173, 238, 0.2);
            }
        }

        /* HALLO CISS */
        .tomato {
            margin: 10px 0 20px;
            color: #ffb9b0;
            font-family: 'Cormorant Garamond', serif;
            font-size: 36px;
            font-weight: 600;
        }

        /* HALLO JAPAN */
        .border-text {
            margin: 0 auto 25px;
            padding: 13px;
            max-width: 340px;

            border: 2px solid #a7c7ff;
            border-radius: 12px;

            color: #d5e4ff;
            font-size: 18px;
            letter-spacing: 2px;

            box-shadow: 0 0 15px rgba(141, 187, 255, 0.12);
            transition: 0.3s;
        }

        .border-text:hover {
            box-shadow: 0 0 20px rgba(141, 187, 255, 0.3);
            transform: scale(1.02);
        }

        /* TOMBOL LINK */
        .link-button {
            display: inline-block;
            padding: 12px 26px;

            border: 1px solid #e6d09d;
            border-radius: 30px;

            background: linear-gradient(135deg, #f2dfa9, #d1b9eb);
            color: #302747;

            font-size: 13px;
            font-weight: 700;
            text-decoration: none;

            transition: 0.3s;
        }

        .link-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(226, 197, 244, 0.3);
        }

        /* FOOTER */
        .footer {
            margin-top: 28px;
            color: #e0d7f0;
            font-size: 10px;
            letter-spacing: 1px;
        }

        /* TAMPILAN HP */
        @media (max-width: 520px) {
            .container {
                padding: 30px 18px;
            }

            .subtitle {
                font-size: 9px;
                letter-spacing: 3px;
            }

            .judul {
                font-size: 37px;
            }

            .n {
                font-size: 12px;
            }

            .border-text {
                font-size: 15px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

    <!-- CAHAYA BACKGROUND -->
    <div class="glow"></div>

    <!-- BINTANG -->
    <div class="stars">
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>☾</span>
        <span>✧</span>
        <span>✦</span>
        <span>·</span>
    </div>

    <!-- KONTEN -->
    <main class="container">

        <div class="moon">☾</div>

        <p class="subtitle">
            ✧ THE MYSTICAL WORLD ✧
        </p>

        <h1 class="judul">
            Prince in the
            <span>Kingdom Brins</span>
        </h1>

        <p class="n">
            Prince soooo cutieee arghhh ♡
        </p>

        <h2 class="tomato">
            Hallo ciss ♡
        </h2>

        <h2 class="border-text">
            HALLO NIHAOO ✧
        </h2>

        <a href="index.html" class="link-button">
            ✦ Keinginanku ✦
        </a>

        <p class="footer">
            ✧ written under the stars, with love ✧
        </p>

    </main>

</body>
</html>
