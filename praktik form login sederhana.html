```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot Login</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background:
                radial-gradient(circle at top, #7778a8, transparent 45%),
                linear-gradient(135deg, #10172f, #272541, #10172f);
            color: #fff;
            overflow-x: hidden;
        }

        /* Hiasan bintang */
        body::before {
            content: "✦  ·  ✧     ✦   ·     ✧  ✦";
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 25px;
            letter-spacing: 18px;
            color: #e8d9a6;
            opacity: 0.7;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 850px;
            padding: 35px;
            border: 1px solid rgba(231, 220, 255, 0.35);
            border-radius: 25px;
            background: rgba(23, 25, 52, 0.82);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header .symbol {
            font-size: 38px;
            color: #e9d7a3;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 30px;
            color: #f4e6bd;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 13px;
            color: #c8c4df;
            margin-top: 8px;
        }

        /* Kartu tarot */
        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .tarot-card {
            width: 150px;
            height: 205px;
            border: 1px solid #b9b1d4;
            border-radius: 15px;
            background:
                radial-gradient(circle, transparent 35%, rgba(219, 211, 246, 0.12) 36%, transparent 38%),
                repeating-radial-gradient(
                    circle,
                    transparent 0 12px,
                    rgba(220, 215, 242, 0.15) 13px 14px
                ),
                linear-gradient(145deg, #77728f, #444666, #77728f);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: 0.3s ease;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
        }

        .tarot-card::before {
            content: "☾";
            position: absolute;
            top: 12px;
            font-size: 25px;
            color: #e9dfb9;
        }

        .tarot-card::after {
            content: "✧  ✦  ✧";
            position: absolute;
            bottom: 12px;
            color: #e9dfb9;
            font-size: 16px;
        }

        .tarot-card span {
            padding: 8px 12px;
            border-radius: 10px;
            background: #fff8e9;
            color: #25243a;
            font-weight: 700;
            font-size: 16px;
        }

        .tarot-card:hover {
            transform: translateY(-8px) rotate(-2deg);
            box-shadow: 0 12px 25px rgba(185, 165, 255, 0.25);
        }

        /* Form login */
        .login-form {
            max-width: 420px;
            margin: 0 auto;
        }

        .login-form h2 {
            text-align: center;
            font-size: 21px;
            margin-bottom: 20px;
            color: #f4e6bd;
        }

        .input-group {
            margin-bottom: 17px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            color: #e0dcef;
            font-size: 13px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #777596;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }

        .input-group input::placeholder {
            color: #aaa7c3;
        }

        .input-group input:focus {
            border-color: #e9d7a3;
            box-shadow: 0 0 10px rgba(233, 215, 163, 0.2);
        }

        .login-button {
            width: 100%;
            padding: 13px;
            margin-top: 5px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #e9d7a3, #c5b5e6);
            color: #29253e;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(201, 183, 239, 0.25);
        }

        #pesan {
            text-align: center;
            font-size: 13px;
            margin-top: 15px;
            min-height: 20px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #aaa7c3;
            font-size: 11px;
        }

        @media (max-width: 550px) {
            .container {
                padding: 22px 16px;
            }

            .header h1 {
                font-size: 24px;
            }

            .cards {
                gap: 9px;
            }

            .tarot-card {
                width: 31%;
                height: 150px;
            }

            .tarot-card span {
                font-size: 12px;
                padding: 7px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header class="header">
            <div class="symbol">☼ ✧ ☾</div>
            <h1>ASTRAL LOGIN</h1>
            <p>Unlock the secrets written in the stars ✨</p>
        </header>

        <div class="cards">
            <div class="tarot-card">
                <span>PILE 1</span>
            </div>

            <div class="tarot-card">
                <span>PILE 2</span>
            </div>

            <div class="tarot-card">
                <span>PILE 3</span>
            </div>
        </div>

        <form class="login-form" id="loginForm">
            <h2>✦ Welcome Back ✦</h2>

            <div class="input-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    required
                >
            </div>

            <button type="submit" class="login-button">
                ✧ LOGIN ✧
            </button>

            <p id="pesan"></p>
        </form>

        <footer class="footer">
            ✦ Follow the stars, discover your destiny ✦
        </footer>

    </div>

    <script>
        const form = document.getElementById("loginForm");
        const pesan = document.getElementById("pesan");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            if (username === "Admin" && password === "12345") {
                pesan.style.color = "#b8f5c8";
                pesan.textContent = "Login berhasil! Selamat datang, " + username + " ✨";
            } else {
                pesan.style.color = "#ffaaaa";
                pesan.textContent = "Username atau password salah! Coba lagi ya.";
            }
        });
    </script>

</body>
</html>
```
