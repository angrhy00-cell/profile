<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jong Woo Clnut Login</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            overflow-x: hidden;
            position: relative;
            background: #17182f;
        }

        /* BACKGROUND GAMBAR JONG WOO */
        .background {
            position: fixed;
            inset: -30px;
            z-index: -3;

            background-image:
                linear-gradient(
                    rgba(15, 18, 43, 0.38),
                    rgba(15, 18, 43, 0.58)
                ),
                url('jongwoo.jfif');

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            animation: backgroundMove 18s ease-in-out infinite alternate;
        }

        @keyframes backgroundMove {
            from {
                transform: scale(1) translateY(0);
            }

            to {
                transform: scale(1.12) translateY(-10px);
            }
        }

        /* Lapisan cahaya */
        .glow {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(194, 179, 255, 0.22),
                    transparent 40%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(129, 164, 255, 0.2),
                    transparent 40%
                );
        }

        /* Bintang bergerak */
        .stars {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            color: #fff0bf;
            animation: twinkle 3s ease-in-out infinite,
                       floatStar 7s ease-in-out infinite;
        }

        .star:nth-child(1) {
            top: 12%;
            left: 12%;
            font-size: 22px;
        }

        .star:nth-child(2) {
            top: 20%;
            right: 15%;
            font-size: 17px;
            animation-delay: 1s;
        }

        .star:nth-child(3) {
            top: 75%;
            left: 10%;
            font-size: 20px;
            animation-delay: 2s;
        }

        .star:nth-child(4) {
            top: 80%;
            right: 12%;
            font-size: 25px;
            animation-delay: 0.5s;
        }

        .star:nth-child(5) {
            top: 45%;
            left: 5%;
            font-size: 14px;
            animation-delay: 1.5s;
        }

        .star:nth-child(6) {
            top: 35%;
            right: 7%;
            font-size: 16px;
            animation-delay: 2s;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes floatStar {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        /* KOTAK LOGIN */
        .login-container {
            width: 100%;
            max-width: 390px;
            padding: 30px;
            text-align: center;

            background: rgba(25, 25, 53, 0.83);
            border: 1px solid rgba(235, 224, 255, 0.55);
            border-radius: 25px;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.35),
                0 0 25px rgba(192, 174, 255, 0.15);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            animation: loginAppear 1s ease both;
        }

        @keyframes loginAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .moon {
            font-size: 48px;
            color: #f5e2ad;
            text-shadow: 0 0 20px rgba(245, 226, 173, 0.6);
            animation: moonFloat 4s ease-in-out infinite;
        }

        @keyframes moonFloat {
            0%, 100% {
                transform: translateY(0) rotate(-5deg);
            }

            50% {
                transform: translateY(-7px) rotate(5deg);
            }
        }

        h1 {
            color: #f5e5bc;
            font-size: 28px;
            letter-spacing: 4px;
            margin-top: 5px;
        }

        .subtitle {
            font-size: 12px;
            color: #d8d4ed;
            line-height: 1.8;
            margin: 10px 0 25px;
        }

        /* HIASAN KARTU TAROT */
        .tarot-decoration {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .mini-card {
            width: 65px;
            height: 88px;
            border: 1px solid #c9bce9;
            border-radius: 9px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #f5e5bc;
            font-size: 24px;

            background:
                repeating-radial-gradient(
                    circle,
                    transparent 0 7px,
                    rgba(221, 213, 250, 0.12) 8px 9px
                ),
                linear-gradient(145deg, #777394, #373653);

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);

            animation: cardFloat 4s ease-in-out infinite;
        }

        .mini-card:nth-child(2) {
            transform: translateY(-8px);
            animation-delay: 0.5s;
        }

        .mini-card:nth-child(3) {
            animation-delay: 1s;
        }

        @keyframes cardFloat {
            0%, 100% {
                translate: 0 0;
            }

            50% {
                translate: 0 -7px;
            }
        }

        /* INPUT FORM */
        .input-group {
            text-align: left;
            margin-bottom: 17px;
        }

        label {
            display: block;
            color: #e9e3f7;
            font-size: 13px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #827ba4;
            border-radius: 11px;
            outline: none;

            background: rgba(255, 255, 255, 0.09);
            color: white;

            font-family: inherit;
            font-size: 13px;
            transition: 0.3s;
        }

        input::placeholder {
            color: #c1bbd5;
        }

        input:focus {
            border-color: #f5e2ad;
            box-shadow: 0 0 12px rgba(245, 226, 173, 0.18);
        }

        /* TOMBOL LOGIN */
        button {
            width: 100%;
            padding: 13px;
            margin-top: 5px;

            border: none;
            border-radius: 11px;

            background: linear-gradient(135deg, #f5e2ad, #c8b7ef);
            color: #292640;

            font-family: inherit;
            font-weight: 700;
            font-size: 14px;

            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(200, 183, 239, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        #pesan {
            min-height: 20px;
            margin-top: 15px;
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        .footer {
            margin-top: 22px;
            color: #c7c1dc;
            font-size: 11px;
        }

        @media (max-width: 420px) {
            .login-container {
                padding: 25px 21px;
            }

            h1 {
                font-size: 25px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

    <!-- Background Jong Woo -->
    <div class="background"></div>
    <div class="glow"></div>

    <!-- Bintang -->
    <div class="stars">
        <span class="star">✦</span>
        <span class="star">✧</span>
        <span class="star">✦</span>
        <span class="star">✧</span>
        <span class="star">·</span>
        <span class="star">✦</span>
    </div>

    <!-- Form Login -->
    <main class="login-container">

        <div class="moon">☾</div>

        <h1>CLNUT</h1>

        <p class="subtitle">
            Welcome to My little WEb HiHi^^ ✨<br>
            Let the stars guide This ^^.
        </p>

        <!-- Kartu tarot kecil -->
        <div class="tarot-decoration">
            <div class="mini-card">☾</div>
            <div class="mini-card">✧</div>
            <div class="mini-card">☼</div>
        </div>

        <form id="loginForm">

            <div class="input-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">✧ LOGIN ✧</button>

            <p id="pesan" aria-live="polite"></p>

        </form>

        <div class="footer">
            ✦ Made with love under the Pie ✦
        </div>

    </main>

    <script>
        const form = document.getElementById("loginForm");
        const pesan = document.getElementById("pesan");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            if (
                username === "anugrah" &&
                password === "4809"
            ) {
                pesan.style.color = "#b8f5c8";
                pesan.textContent =
                    "Login berhasil! Welcome, Anugrah ✨";
            } else {
                pesan.style.color = "#ffaaaa";
                pesan.textContent =
                    "Username atau password salah. Coba lagi ya!";
            }
        });
    </script>

</body>
</html>
