<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Astral</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Poppins', sans-serif;
            color: white;
            background:
                radial-gradient(circle at 50% 20%, #62638e, transparent 45%),
                linear-gradient(135deg, #10172f, #302b50, #10172f);
            overflow: hidden;
        }

        /* Hiasan bintang */
        .stars {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            color: #f3e5b8;
        }

        .star {
            position: absolute;
            animation: twinkle 3s infinite ease-in-out;
        }

        .star:nth-child(1) {
            top: 10%;
            left: 15%;
            font-size: 22px;
        }

        .star:nth-child(2) {
            top: 20%;
            right: 15%;
            font-size: 16px;
            animation-delay: 1s;
        }

        .star:nth-child(3) {
            top: 75%;
            left: 10%;
            font-size: 18px;
            animation-delay: 2s;
        }

        .star:nth-child(4) {
            top: 80%;
            right: 12%;
            font-size: 25px;
            animation-delay: 0.5s;
        }

        .star:nth-child(5) {
            top: 45%;
            left: 5%;
            font-size: 13px;
            animation-delay: 1.5s;
        }

        .star:nth-child(6) {
            top: 35%;
            right: 7%;
            font-size: 14px;
            animation-delay: 2s;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.35;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* Kotak login */
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 390px;
            padding: 38px 30px;
            border: 1px solid rgba(226, 218, 255, 0.35);
            border-radius: 25px;
            text-align: center;
            background: rgba(24, 26, 54, 0.88);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            animation: appear 0.8s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .moon {
            font-size: 55px;
            margin-bottom: 8px;
            color: #f2dfaa;
            text-shadow: 0 0 20px rgba(242, 223, 170, 0.4);
        }

        h1 {
            font-size: 27px;
            letter-spacing: 3px;
            color: #f2dfaa;
        }

        .subtitle {
            margin: 10px 0 28px;
            color: #c7c4df;
            font-size: 12px;
            line-height: 1.7;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #e6e0f4;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #777596;
            border-radius: 12px;
            outline: none;
            background: rgba(255, 255, 255, 0.07);
            color: white;
            font-family: inherit;
            font-size: 13px;
            transition: 0.3s;
        }

        input::placeholder {
            color: #aaa8c2;
        }

        input:focus {
            border-color: #f2dfaa;
            box-shadow: 0 0 12px rgba(242, 223, 170, 0.15);
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #f2dfaa, #c6b6e8);
            color: #29253e;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(198, 182, 232, 0.25);
        }

        #pesan {
            min-height: 20px;
            margin-top: 18px;
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        .footer {
            margin-top: 25px;
            font-size: 11px;
            color: #aaa7c3;
        }

        @media (max-width: 400px) {
            .login-container {
                padding: 30px 22px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="stars">
        <span class="star">✦</span>
        <span class="star">✧</span>
        <span class="star">✦</span>
        <span class="star">✧</span>
        <span class="star">·</span>
        <span class="star">✦</span>
    </div>

    <div class="login-container">

        <div class="moon">☾</div>

        <h1>ASTRAL</h1>

        <p class="subtitle">
            Welcome to your little universe ✨<br>
            Masuk dan temukan duniamu.
        </p>

        <form id="loginForm">

            <div class="input-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">✧ LOGIN ✧</button>

            <p id="pesan" aria-live="polite"></p>

        </form>

        <div class="footer">
            ✦ Made under the stars ✦
        </div>

    </div>

    <script>
        const form = document.getElementById("loginForm");
        const pesan = document.getElementById("pesan");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            if (username === "anugrah" && password === "4809") {
                pesan.style.color = "#b8f5c8";
                pesan.textContent = "Login berhasil! Selamat datang, Anugrah ✨";
            } else {
                pesan.style.color = "#ffaaaa";
                pesan.textContent = "Username atau password salah. Coba lagi ya!";
            }
        });
    </script>

</body>
</html>
