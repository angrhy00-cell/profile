```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clnut Login - Jong Woo</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            padding: 25px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            color: #fff8e8;
            background: #17152d;
            overflow-x: hidden;
            position: relative;
        }

        /* BACKGROUND JONG WOO */
        body::before {
            content: "";
            position: fixed;
            inset: -20px;
            z-index: -3;

            background-image:
                linear-gradient(
                    rgba(19, 17, 43, 0.30),
                    rgba(19, 17, 43, 0.50)
                ),
                url("jongwoo.jfif");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            animation: backgroundMove 18s ease-in-out infinite alternate;
        }

        @keyframes backgroundMove {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.10) translateY(-8px);
            }
        }

        /* EFEK CAHAYA */
        .glow {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(201, 177, 255, 0.18),
                    transparent 40%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(137, 160, 255, 0.15),
                    transparent 40%
                );
        }

        /* BINTANG */
        .stars {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            color: #f5dfa2;
            animation: twinkle 3s ease-in-out infinite,
                       floatStar 6s ease-in-out infinite;
        }

        .star:nth-child(1) {
            top: 10%;
            left: 12%;
            font-size: 22px;
        }

        .star:nth-child(2) {
            top: 20%;
            right: 15%;
            font-size: 18px;
            animation-delay: 1s;
        }

        .star:nth-child(3) {
            top: 75%;
            left: 10%;
            font-size: 20px;
            animation-delay: 2s;
        }

        .star:nth-child(4) {
            top: 12%;
            right: 35%;
            font-size: 30px;
        }

        .star:nth-child(5) {
            top: 60%;
            right: 10%;
            font-size: 17px;
            animation-delay: 1.5s;
        }

        .star:nth-child(6) {
            top: 85%;
            right: 25%;
            font-size: 24px;
            animation-delay: 0.5s;
        }

        .star:nth-child(7) {
            top: 40%;
            left: 5%;
            font-size: 14px;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes floatStar {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        /* KOTAK LOGIN */
        .login-container {
            width: 100%;
            max-width: 390px;
            padding: 35px 28px;
            text-align: center;

            background: rgba(25, 22, 51, 0.78);
            border: 1px solid rgba(240, 220, 174, 0.5);
            border-radius: 25px;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.35),
                0 0 25px rgba(190, 165, 255, 0.15);

            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);

            animation: appear 0.9s ease both;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* BULAN */
        .moon {
            font-size: 53px;
            color: #f4dfa5;
            text-shadow: 0 0 20px rgba(244, 223, 165, 0.6);
            animation: moonMove 4s ease-in-out infinite;
        }

        @keyframes moonMove {
            0%, 100% {
                transform: translateY(0) rotate(-5deg);
            }

            50% {
                transform: translateY(-8px) rotate(5deg);
            }
        }

        h1 {
            margin-top: 5px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 42px;
            letter-spacing: 5px;
            color: #f5e5bc;
        }

        .subtitle {
            margin: 8px 0 28px;
            color: #d8cfee;
            font-size: 12px;
            line-height: 1.8;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            color: #f0dba6;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(240, 220, 174, 0.4);
        }

        /* INPUT */
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #eee7fa;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #827ba4;
            border-radius: 11px;
            outline: none;

            background: rgba(255, 255, 255, 0.08);
            color: white;

            font-family: inherit;
            font-size: 13px;
            transition: 0.3s;
        }

        input::placeholder {
            color: #c1bbd5;
        }

        input:focus {
            border-color: #f5e2ad;
            box-shadow: 0 0 12px rgba(245, 226, 173, 0.2);
        }

        /* TOMBOL */
        .login-button {
            width: 100%;
            margin-top: 7px;
            padding: 13px;

            border: none;
            border-radius: 11px;

            background: linear-gradient(135deg, #f2dfa9, #d1b9eb);
            color: #302747;

            font-family: inherit;
            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
            transition: 0.3s;
        }

        .login-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(226, 197, 244, 0.3);
        }

        .login-button:active {
            transform: scale(0.98);
        }

        #pesan {
            min-height: 20px;
            margin-top: 16px;
            font-size: 12px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .footer {
            margin-top: 25px;
            color: #d4cbe6;
            font-size: 10px;
            letter-spacing: 1px;
        }

        /* RESPONSIVE HP */
        @media (max-width: 420px) {
            .login-container {
                padding: 30px 22px;
            }

            h1 {
                font-size: 36px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

    <!-- CAHAYA BACKGROUND -->
    <div class="glow"></div>

    <!-- BINTANG BERKELIP -->
    <div class="stars">
        <span class="star">✦</span>
        <span class="star">✧</span>
        <span class="star">✦</span>
        <span class="star">☾</span>
        <span class="star">✧</span>
        <span class="star">✦</span>
        <span class="star">·</span>
    </div>

    <!-- FORM LOGIN -->
    <main class="login-container">

        <div class="moon">☾</div>

        <h1>ASTRAL</h1>

        <p class="subtitle">
            Welcome to your little universe ✨<br>
            Let the stars guide you.
        </p>

        <div class="divider">
            ✧ SIGN IN ✧
        </div>

        <form id="loginForm">

            <div class="input-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="login-button">
                ✧ LOGIN ✧
            </button>

            <p id="pesan" aria-live="polite"></p>

        </form>

        <div class="footer">
            ✦ Made with love under the stars ✦
        </div>

    </main>

    <script>
        const form = document.getElementById("loginForm");
        const pesan = document.getElementById("pesan");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            if (
                username === "anugrah" &&
                password === "4809"
            ) {
                pesan.style.color = "#b8f5c8";
                pesan.textContent =
                    "Login berhasil! Welcome, Anugrah ✨";
            } else {
                pesan.style.color = "#ffaaaa";
                pesan.textContent =
                    "Username atau password salah. Coba lagi ya!";
            }
        });
    </script>

</body>
</html>
```
