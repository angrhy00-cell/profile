<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>♡ Praktikum JavaScript Anugrah ♡</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --green: #54b85b;
    --dark-green: #206b3b;
    --light-green: #e7f9df;
    --text: #405b49;
}

body {
    min-height: 100vh;
    padding: 20px 15px;
    font-family: 'Nunito', sans-serif;
    color: var(--text);
    background: white;
    overflow-x: hidden;
    transition: background-color .5s ease;
}

/* BACKGROUND JONGWOO */
.wallpaper {
    position: fixed;
    inset: 0;
    z-index: -2;
    overflow: hidden;
    background: white;
    pointer-events: none;
}

.wallpaper::before {
    content: "";
    position: absolute;
    inset: -50px;
    background-image: url("jongwoo.jfif");
    background-size: 150px auto;
    background-repeat: repeat;
    opacity: 0.13;
    transform: rotate(-7deg) scale(1.1);
    animation: wallpaperMove 40s linear infinite;
}

.wallpaper::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,.5);
}

@keyframes wallpaperMove {
    from { background-position: 0 0; }
    to { background-position: 300px 150px; }
}

/* HIASAN */
.decoration {
    position: fixed;
    z-index: -1;
    color: #65bd63;
    pointer-events: none;
    animation: floating 4s ease-in-out infinite;
}

.deco1 {
    top: 15%;
    left: 5%;
    font-size: 40px;
}

.deco2 {
    top: 35%;
    right: 6%;
    font-size: 35px;
    animation-delay: 1s;
}

.deco3 {
    bottom: 15%;
    left: 7%;
    font-size: 35px;
    animation-delay: 2s;
}

.deco4 {
    bottom: 20%;
    right: 8%;
    font-size: 40px;
    animation-delay: .5s;
}

@keyframes floating {
    0%, 100% {
        transform: translateY(0) rotate(-8deg);
    }
    50% {
        transform: translateY(-13px) rotate(8deg);
    }
}

/* NAVBAR */
.navbar {
    max-width: 900px;
    margin: 0 auto 25px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border: 1px solid #e0f1d9;
    border-radius: 20px;
    background: rgba(255,255,255,.94);
    box-shadow: 0 5px 20px #8ecf821a;
}

.logo {
    color: var(--dark-green);
    font-size: 19px;
    font-weight: 900;
    text-decoration: none;
}

.logo span {
    color: var(--green);
}

.nav-link {
    color: var(--dark-green);
    font-size: 13px;
    font-weight: 800;
    text-decoration: none;
}

/* KARTU UTAMA */
.container {
    max-width: 900px;
    margin: auto;
}

.main-card {
    padding: 30px;
    border: 2px solid #d7efce;
    border-radius: 30px;
    background: rgba(255,255,255,.95);
    box-shadow: 0 15px 40px #76ba7226;
    animation: appear .8s ease both;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* JUDUL */
.heading {
    margin-bottom: 28px;
    text-align: center;
}

.mini-title {
    display: inline-block;
    margin-bottom: 12px;
    padding: 6px 15px;
    border-radius: 30px;
    color: var(--dark-green);
    background: var(--light-green);
    font-size: 12px;
    font-weight: 900;
}

.heading h1 {
    color: var(--dark-green);
    font-size: clamp(25px, 5vw, 38px);
    font-weight: 900;
}

.heading h1 span {
    color: var(--green);
}

.heading p {
    margin-top: 8px;
    color: #7a9a80;
    font-size: 14px;
    line-height: 1.8;
}

/* KARTU SAMBUTAN */
.welcome {
    padding: 22px;
    margin-bottom: 22px;
    border: 1px solid #cdebc4;
    border-radius: 22px;
    background: linear-gradient(135deg, #edffe8, #ffffff);
    text-align: center;
}

.welcome h2 {
    color: var(--dark-green);
    font-size: 22px;
}

.welcome p {
    margin-top: 8px;
    color: #58775d;
    font-size: 14px;
    line-height: 1.8;
}

/* AREA INTERAKSI */
.section-title {
    margin: 25px 0 13px;
    color: var(--dark-green);
    font-size: 20px;
    font-weight: 900;
}

.interactive-card {
    padding: 22px;
    margin-bottom: 16px;
    border: 1px solid #deefd8;
    border-radius: 20px;
    background: linear-gradient(135deg, #f7fff3, #ffffff);
    transition: .3s;
}

.interactive-card:hover {
    border-color: #9ed795;
    box-shadow: 0 7px 18px #8bce8225;
}

.interactive-card h3 {
    margin-bottom: 8px;
    color: var(--dark-green);
    font-size: 17px;
}

.interactive-card p {
    color: #58775d;
    font-size: 13px;
    line-height: 1.8;
}

/* TOMBOL */
.buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 15px;
}

.btn {
    display: inline-block;
    padding: 11px 18px;
    border: 1px solid var(--green);
    border-radius: 30px;
    background: white;
    color: var(--dark-green);
    font-family: inherit;
    font-size: 12px;
    font-weight: 900;
    text-decoration: none;
    cursor: pointer;
    transition: .3s;
}

.btn-primary {
    color: white;
    background: linear-gradient(135deg, #62c45b, #339c49);
    border-color: transparent;
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 7px 18px #8bce8245;
}

/* PESAN JAVASCRIPT */
.message-box {
    min-height: 60px;
    margin-top: 15px;
    padding: 15px;
    border: 1px dashed #a8d99b;
    border-radius: 15px;
    background: #f3ffed;
    color: var(--dark-green);
    text-align: center;
    font-size: 14px;
    font-weight: 800;
    overflow-wrap: anywhere;
}

.counter {
    display: inline-block;
    margin-top: 12px;
    padding: 8px 15px;
    border-radius: 30px;
    background: #e2f7d9;
    color: var(--dark-green);
    font-size: 13px;
    font-weight: 900;
}

.name-input {
    width: 100%;
    margin-top: 12
