
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>List di dalam List - Clnut</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            padding: 25px;
            font-family: 'Trebuchet MS', sans-serif;
            color: white;

            /* Background gambar */
            background:
                linear-gradient(
                    rgba(35, 20, 25, 0.40),
                    rgba(35, 20, 25, 0.60)
                ),
                url('china girl.jpg');

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow-x: hidden;
        }

        /* KOTAK UTAMA */
        .container {
            width: 90%;
            max-width: 650px;
            padding: 40px;

            background: rgba(255, 240, 235, 0.22);
            backdrop-filter: blur(12px);

            border: 2px solid rgba(255,255,255,0.7);
            border-radius: 25px;

            box-shadow: 0 10px 35px #00000040;

            animation: muncul 1.5s ease;
        }

        /* JUDUL */
        .hiasan {
            text-align: center;
            font-size: 30px;
            margin-bottom: 15px;

            animation: float 3s infinite ease-in-out;
        }

        .china {
            text-align: center;
            font-size: 25px;
            letter-spacing: 8px;
            color: #ffe2c9;

            text-shadow: 0 0 15px #ffb6c1;
            margin-bottom: 15px;
        }

        h1 {
            text-align: center;
            font-size: clamp(25px, 5vw, 36px);
            color: #fff5ed;

            text-shadow:
                0 0 10px #ffb6c1,
                0 0 20px white;

            animation: float 3s infinite ease-in-out;
        }

        .subtitle {
            text-align: center;
            margin-top: 12px;
            color: #ffe9e3;
            letter-spacing: 3px;
            font-size: 13px;
        }

        .garis {
            width: 100px;
            height: 2px;
            background: #ffe1c9;
            margin: 25px auto;
            box-shadow: 0 0 10px white;
        }

        /* LIST UTAMA */
        ol {
            padding-left: 35px;
            color: #fff5ed;
            font-size: 19px;
            font-weight: bold;
        }

        ol > li {
            padding: 15px;
            margin: 12px 0;

            background: rgba(255, 230, 225, 0.18);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 15px;

            transition: 0.4s;
        }

        ol > li:hover {
            background: rgba(255, 210, 220, 0.35);
            transform: translateX(8px);
            box-shadow: 0 5px 15px #00000025;
        }

        /* LIST DI DALAM LIST */
        ul {
            padding-left: 30px;
            margin-top: 12px;
        }

        ul li {
            padding: 8px;
            margin: 6px 0;

            color: #fff0e6;
            font-size: 16px;
            font-weight: normal;

            background: rgba(255,255,255,0.13);
            border-radius: 10px;

            transition: 0.3s;
        }

        ul li:hover {
            color: #ffe1c9;
            background: rgba(255,255,255,0.30);
            transform: translateX(7px);
        }

        /* FOOTER */
        .footer {
            text-align: center;
            margin-top: 25px;
            color: #ffe5e8;
            letter-spacing: 3px;
            font-size: 13px;
        }

        /* ANIMASI */
        @keyframes muncul {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        /* BUNGA JATUH */
        .petal {
            position: fixed;
            top: -40px;
            font-size: 23px;
            pointer-events: none;

            animation: jatuh linear infinite;
        }

        .petal:nth-child(1) {
            left: 10%;
            animation-duration: 8s;
        }

        .petal:nth-child(2) {
            left: 30%;
            animation-duration: 11s;
            animation-delay: 2s;
        }

        .petal:nth-child(3) {
            left: 55%;
            animation-duration: 9s;
            animation-delay: 1s;
        }

        .petal:nth-child(4) {
            left: 75%;
            animation-duration: 12s;
            animation-delay: 3s;
        }

        .petal:nth-child(5) {
            left: 90%;
            animation-duration: 10s;
            animation-delay: 2s;
        }

        @keyframes jatuh {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .container {
                width: 100%;
                padding: 25px 18px;
            }

            ol {
                font-size: 17px;
                padding-left: 25px;
            }

            ul li {
                font-size: 15px;
            }
        }

    </style>
</head>

<body>

    <!-- BUNGA BERJATUHAN -->
    <div class="petal">🌸</div>
    <div class="petal">🌷</div>
    <div class="petal">🌸</div>
    <div class="petal">🌷</div>
    <div class="petal">🌸</div>

    <div class="container">

        <div class="china">
            切 苏 娜
        </div>

        <h1>Distro Linux dan Keluarganya</h1>

        <div class="subtitle">
            ✧ LIST DI DALAM LIST ✧
        </div>

        <div class="garis"></div>

        <!-- LIST UTAMA -->
        <ol>

            <li>
                Debian

                <ul>
                    <li>Ubuntu</li>
                    <li>Mint</li>
                    <li>elementaryOs</li>
                </ul>

            </li>

            <li>
                RedHat

                <ul>
                    <li>Fedora</li>
                </ul>

            </li>

            <li>
                Slackware
            </li>

        </ol>

        <div class="garis"></div>

        <div class="china">
            花 · 梦 · 美
        </div>

        <div class="footer">
            ✧ A LITTLE WORLD OF CLNUT ✧
        </div>

    </div>

</body>
</html>
