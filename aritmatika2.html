<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Aritmatika 💚</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-family: 'Nunito', sans-serif;
            color: #24543a;
            background: linear-gradient(135deg, #eaffef, #c8f5d6, #ffffff);
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: url("jongwoo.jfif") center/cover no-repeat;
            opacity: 0.12;
            z-index: -1;
        }

        header {
            text-align: center;
            padding: 25px 10px;
        }

        header h1 {
            color: #25834c;
            font-size: 30px;
            margin-bottom: 8px;
        }

        header p {
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.94);
            border: 2px solid #c8efd4;
            border-radius: 22px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 6px 18px rgba(49, 128, 75, 0.12);
        }

        h2 {
            color: #25834c;
            margin-top: 0;
        }

        .input-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .input-group div {
            flex: 1;
            min-width: 120px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 800;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #b9e9c8;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #40ad68;
        }

        button {
            background: #40ad68;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            margin: 4px;
            font-family: inherit;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #25834c;
            transform: translateY(-2px);
        }

        .reset {
            background: #f0a3b8;
        }

        .hasil {
            background: #edfff1;
            border: 1px solid #c8efd4;
            border-radius: 14px;
            padding: 15px;
            margin-top: 15px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .hasil p {
            background: white;
            border-radius: 10px;
            padding: 10px;
            margin: 9px 0;
        }

        .angka {
            color: #25834c;
            font-weight: 800;
        }

        footer {
            text-align: center;
            padding: 15px;
            color: #477958;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 25px;
            }

            .card {
                padding: 17px;
            }

            button {
                width: 100%;
                margin: 5px 0;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🌷 Operator Aritmatika 🌷</h1>
        <p>Belajar JavaScript dengan cara yang menyenangkan 💚</p>
    </header>

    <main class="container">

        <section class="card">
            <h2>💚 Masukkan Angka</h2>
            <p>Masukkan angka yang ingin kamu hitung.</p>

            <div class="input-group">
                <div>
                    <label for="angka1">Angka Pertama</label>
                    <input type="number" id="angka1" value="8">
                </div>

                <div>
                    <label for="angka2">Angka Kedua</label>
                    <input type="number" id="angka2" value="4">
                </div>
            </div>

            <button type="button" onclick="hitung()">Hitung Sekarang ✨</button>
            <button type="button" class="reset" onclick="resetAngka()">Reset 🔄</button>
        </section>

        <section class="card">
            <h2>🧮 Hasil Perhitungan</h2>

            <div class="hasil" id="hasil">
                Hasil perhitungan akan muncul di sini 🌸
            </div>
        </section>

    </main>

    <footer>
        Dibuat dengan 💚 dan semangat belajar coding!
    </footer>

    <script>
        function hitung() {
            const angka1 = Number(document.getElementById("angka1").value);
            const angka2 = Number(document.getElementById("angka2").value);

            const hasilkurang = angka1 - angka2;
            const hasiljumlah = angka1 + angka2;
            const hasilkali = angka1 * angka2;
            const hasilkuadrat = angka1 ** angka2;

            // Mengikuti rumus dari kode asli:
            // angka1 ** 1 / angka2 berarti angka1 pangkat 1, lalu dibagi angka2.
            const hasilakar = angka2 === 0
                ? "Tidak bisa dibagi dengan 0"
                : angka1 ** 1 / angka2;

            document.getElementById("hasil").innerHTML = `
                <p>➖ Pengurangan:<br>
                <span class="angka">${angka1} - ${angka2} = ${hasilkurang}</span></p>

                <p>➕ Penjumlahan:<br>
                <span class="angka">${angka1} + ${angka2} = ${hasiljumlah}</span></p>

                <p>✖️ Perkalian:<br>
                <span class="angka">${angka1} × ${angka2} = ${hasilkali}</span></p>

                <p>🔺 Pemangkatan:<br>
                <span class="angka">${angka1} ** ${angka2} = ${hasilkuadrat}</span></p>

                <p>➗ Operasi angka1 ** 1 / angka2:<br>
                <span class="angka">${angka1} ** 1 / ${angka2} = ${hasilakar}</span></p>
            `;
        }

        function resetAngka() {
            document.getElementById("angka1").value = 8;
            document.getElementById("angka2").value = 4;
            hitung();
        }

        // Menampilkan hasil langsung saat halaman dibuka
        hitung();
    </script>

</body>
</html>
